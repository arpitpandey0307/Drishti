<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KIET Campus Terrain + Road Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0}#map{background:#f8f9fa}.notice{position:absolute;z-index:999;left:8px;bottom:28px;background:#fff;padding:4px 8px;font:12px system-ui;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:70%}</style>
</head>
<body>
<div id="map"></div>
<div class="notice">Sanctioned Rev6 16/10/2024 + Copernicus 30m DSM — approx 3-5m, verify vs Google Maps</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.KIET = {};
const map = L.map('map').setView([28.75257, 77.49851], 16);
window.KIET.map = map;
L.control.scale().addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
osm.on('tileerror', ()=>{ map.getContainer().style.background='#f8f9fa'; });
osm.addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'});
window.KIET.layerGroups = {main:L.layerGroup().addTo(map),internal:L.layerGroup().addTo(map),foot:L.layerGroup().addTo(map),context:L.layerGroup().addTo(map),boundary:L.layerGroup().addTo(map),labels:L.layerGroup().addTo(map),terrain:L.layerGroup().addTo(map),accL:L.layerGroup().addTo(map)};
function renderAccurate(acc){
  const G=window.KIET.layerGroups;
  
  
  L.geoJSON(acc.features.filter(f=>f.properties.kind==='label_accurate'),{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#0e6655',fillColor:'#f9e79f',fillOpacity:1,weight:2}).bindTooltip((f.properties.real_name||f.properties.sanctioned_name)+' ('+f.properties.sanctioned_name+')',{permanent:false,direction:'top'})}).addTo(G.accL);
  window.KIET.accurate=acc;
}
function styleRoad(f){
  const p=f.properties||{};
  // footway + steps default to dashed blue
  if(p.highway==='trunk') return {color:'#7e5109',weight:8,opacity:1};
  if(p.highway==='tertiary'||p.highway==='unclassified') return {color:'#7d6608',weight:6,opacity:1};
  if(p.highway==='residential') return {color:'#7f8c8d',weight:3,opacity:1};
  if(p.highway==='service') return {color:'#2c3e50',weight:7,opacity:1};
  return {color:'#7fb3d5',weight:2,opacity:1,dashArray:'6 4'};
}
function styleRoadTop(f){
  const p=f.properties||{};
  if(p.highway==='trunk') return {color:'#e67e22',weight:5};
  if(p.highway==='tertiary'||p.highway==='unclassified') return {color:'#f1c40f',weight:3};
  if(p.highway==='residential') return {color:'#bdc3c7',weight:2};
  if(p.highway==='service') return {color:'#ffffff',weight:4};
  return {color:'#7fb3d5',weight:2,dashArray:'6 4'};
}
window.KIET.styleRoad=styleRoad;
function renderRoads(roads){
  const G=window.KIET.layerGroups;
  roads.features.forEach(f=>{
    const hw=(f.properties||{}).highway||'';
    const grp = (hw==='trunk'||hw==='tertiary'||hw==='unclassified') ? G.main : (hw==='service'||hw==='residential') ? G.internal : G.foot;
    const nm = (f.properties||{}).name || hw;
    L.geoJSON(f,{style:styleRoad}).addTo(grp);
    L.geoJSON(f,{style:styleRoadTop}).bindPopup('<b>'+nm+'</b><br/>highway='+hw+' ref='+((f.properties||{}).ref||'')).addTo(grp);
  });
}
function renderCampus(campus){
  const G=window.KIET.layerGroups, cmap=window.KIET.map;
  
  
  
  
  
}
function renderTerrain(T){
  const G=window.KIET.layerGroups, cmap=window.KIET.map;
  const B=[[28.75069444444444,77.49569444444445],[28.754305555555554,77.50125000000001]];
  const elev=L.imageOverlay('data/terrain_elevation_hillshade.png',B,{opacity:0.55,interactive:false}).addTo(G.terrain);
  const slope=L.imageOverlay('data/terrain_slope_class.png',B,{opacity:0.5,interactive:false});
  const cont=L.geoJSON(T.smooth,{style:f=>({color:'#7b2cbf',weight:1.5,opacity:0.9})}).bindPopup(l=>'<b>'+l.feature.properties.elevation_m+' m</b><br/>2m contour (30m source, smoothed display)').addTo(G.terrain);
  const low=L.geoJSON(T.low,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#0057b8',fillColor:'#aed6f1',fillOpacity:1,weight:2}).bindPopup('<b>Low pocket ~'+f.properties.elevation_m+' m</b><br/>lowest-10% cell — visualization candidate, not a verified drain')}).addTo(G.terrain);
  window.KIET.terrain={elev,slope,cont,low,grid:T.grid,bounds:B};
  // click-to-query elevation (nearest valid 30m cell)
  cmap.on('click',e=>{
    const g=window.KIET.terrain.grid; if(!g||!g.rows) return;
    let best=null,bd=1e9;
    for(const r of g.rows) for(const c of r){
      if(c.elevation_m==null) continue;
      const d=Math.hypot(c.lat-e.latlng.lat,c.lon-e.latlng.lng);
      if(d<bd){bd=d;best=c;}
    }
    // ~25m tolerance in degrees (~0.00025)
    if(best&&bd<0.0003) L.popup().setLatLng(e.latlng).setContent('<b>~'+best.elevation_m+' m</b><br/>nearest 30m DSM cell ('+best.lat.toFixed(4)+', '+best.lon.toFixed(4)+')<br/><small>±4m accuracy — broad fall only</small>').openOn(cmap);
    else L.popup().setLatLng(e.latlng).setContent('No terrain cell here (outside 30m campus grid)').openOn(cmap);
  });
}
function addControls(){
  const G=window.KIET.layerGroups, T=window.KIET.terrain;
  L.control.layers({OSM:osm,Satellite:sat},{
    'Main roads (NH-34/tertiary)':G.main,'Internal (service/residential)':G.internal,'Footpaths':G.foot,
    'Terrain / elevation+hillshade':T.elev,'Terrain / slope class':T.slope,
    'Terrain / contours 2m':T.cont,'Terrain / low pockets':T.low,
    'Accurate labels':G.accL,
  },{collapsed:false}).addTo(map);
  const leg=L.control({position:'bottomright'});
  leg.onAdd=()=>{const d=L.DomUtil.create('div','info legend');d.style.cssText='background:#fff;padding:8px;border-radius:6px;font:12px system-ui';d.innerHTML='<b>Roads + Terrain</b><br/><span style="color:#e67e22">━━</span> Trunk NH-34<br/><span style="color:#fff;background:#2c3e50">━━</span> Campus service<br/><span style="color:#7fb3d5">┄┄</span> Footway<br/><span style="color:#2d6a4f">█</span> Low ~215m <span style="color:#8b5e3c">█</span> High ~231m<br/><span style="color:#7b2cbf">—</span> Contour 2m <span style="color:#0057b8">●</span> Low pocket';return d;};
  leg.addTo(map);
}
const J=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json();});
Promise.all([J('data/roads.geojson'),J('data/campus.geojson'),J('data/terrain_contours_smooth.geojson'),J('data/terrain_low_points.geojson'),J('data/terrain_grid.json'),J('data/campus_accurate.geojson')]).then(([roads,campus,smooth,low,grid,acc])=>{
  window.KIET.raw={roads,campus,acc};
  renderRoads(roads); renderCampus(campus); renderTerrain({smooth,low,grid}); renderAccurate(acc); addControls();
  const b=L.geoJSON(acc.features.filter(f=>f.properties.kind==='boundary_khasra'));
  if(b.getLayers().length) map.fitBounds(b.getBounds().pad(0.15));
  else{const b2=L.geoJSON(campus.features.filter(f=>f.properties.kind==='boundary'));if(b2.getLayers().length)map.fitBounds(b2.getBounds().pad(0.15));}
}).catch(()=>{alert('Could not load data/*.geojson — run via python3 -m http.server');});
</script>
</body>
</html>
