<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KIET Campus Road Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0}#map{background:#f8f9fa}.notice{position:absolute;z-index:999;left:8px;bottom:28px;background:#fff;padding:4px 8px;font:12px system-ui;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2)}</style>
</head>
<body>
<div id="map"></div>
<div class="notice">Sanctioned Rev6 16/10/2024 + OSM — approx 3-5m, verify vs Google Maps</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.KIET = {};
const map = L.map('map').setView([28.75257, 77.49851], 16);
window.KIET.map = map;
L.control.scale().addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
osm.on('tileerror', ()=>{ map.getContainer().style.background='#f8f9fa'; });
osm.addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'});
window.KIET.layerGroups = {main:L.layerGroup().addTo(map),internal:L.layerGroup().addTo(map),foot:L.layerGroup().addTo(map),context:L.layerGroup().addTo(map),boundary:L.layerGroup().addTo(map),labels:L.layerGroup().addTo(map),accL:L.layerGroup().addTo(map)};
function renderAccurate(acc){
  const G=window.KIET.layerGroups;
  
  
  L.geoJSON(acc.features.filter(f=>f.properties.kind==='label_accurate'),{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:4,color:'#0e6655',fillColor:'#f9e79f',fillOpacity:1,weight:2}).bindTooltip((f.properties.real_name||f.properties.sanctioned_name)+' ('+f.properties.sanctioned_name+')',{permanent:false,direction:'top'})}).addTo(G.accL);
  L.control.layers({OSM:osm,Satellite:sat},{'Accurate labels':G.accL,},{collapsed:false}).addTo(map);
  window.KIET.accurate=acc;
}
function styleRoad(f){
  const p=f.properties||{};
  // footway + steps default to dashed blue
  if(p.highway==='trunk') return {color:'#7e5109',weight:8,opacity:1};
  if(p.highway==='tertiary'||p.highway==='unclassified') return {color:'#7d6608',weight:6,opacity:1};
  if(p.highway==='residential') return {color:'#7f8c8d',weight:3,opacity:1};
  if(p.highway==='service') return {color:'#2c3e50',weight:7,opacity:1};
  return {color:'#7fb3d5',weight:2,opacity:1,dashArray:'6 4'};
}
function styleRoadTop(f){
  const p=f.properties||{};
  if(p.highway==='trunk') return {color:'#e67e22',weight:5};
  if(p.highway==='tertiary'||p.highway==='unclassified') return {color:'#f1c40f',weight:3};
  if(p.highway==='residential') return {color:'#bdc3c7',weight:2};
  if(p.highway==='service') return {color:'#ffffff',weight:4};
  return {color:'#7fb3d5',weight:2,dashArray:'6 4'};
}
window.KIET.styleRoad=styleRoad;
function renderRoads(roads){
  const G=window.KIET.layerGroups;
  roads.features.forEach(f=>{
    const hw=(f.properties||{}).highway||'';
    const grp = (hw==='trunk'||hw==='tertiary'||hw==='unclassified') ? G.main : (hw==='service'||hw==='residential') ? G.internal : G.foot;
    const nm = (f.properties||{}).name || hw;
    L.geoJSON(f,{style:styleRoad}).addTo(grp);
    L.geoJSON(f,{style:styleRoadTop}).bindPopup('<b>'+nm+'</b><br/>highway='+hw+' ref='+((f.properties||{}).ref||'')).addTo(grp);
  });
  L.control.layers(null,{ 'Main (NH-34/tertiary)':G.main,'Internal (service/residential)':G.internal,'Footpaths':G.foot },{collapsed:false}).addTo(window.KIET.map);
  const leg=L.control({position:'bottomright'});
  leg.onAdd=()=>{const d=L.DomUtil.create('div','info legend');d.style.cssText='background:#fff;padding:8px;border-radius:6px;font:12px system-ui';d.innerHTML='<b>Roads — NH-34</b><br/><span style="color:#e67e22">━━</span> Trunk NH-34<br/><span style="color:#f1c40f">━━</span> Tertiary<br/><span style="color:#fff;background:#2c3e50">━━</span> Campus service<br/><span style="color:#7fb3d5">┄┄</span> Footway';return d;};
  leg.addTo(window.KIET.map);
}
function renderCampus(campus){
  const G=window.KIET.layerGroups, cmap=window.KIET.map;
}
Promise.all([fetch('data/roads.geojson').then(r=>{if(!r.ok)throw 0;return r.json()}),fetch('data/campus.geojson').then(r=>{if(!r.ok)throw 0;return r.json()}),fetch('data/campus_accurate.geojson').then(r=>{if(!r.ok)throw 0;return r.json()})]).then(([roads,campus,acc])=>{window.KIET.raw={roads,campus,acc};renderRoads(roads);renderCampus(campus);renderAccurate(acc);const b=L.geoJSON(acc.features.filter(f=>f.properties.kind==='boundary_khasra'));if(b.getLayers().length)map.fitBounds(b.getBounds().pad(0.15));else{const b2=L.geoJSON(campus.features.filter(f=>f.properties.kind==='boundary'));if(b2.getLayers().length)map.fitBounds(b2.getBounds().pad(0.15));}}).catch(()=>{alert('Could not load data/*.geojson — run via python3 -m http.server');});
</script>
</body>
</html>
